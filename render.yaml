services:
  - type: web
    name: contentflow-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false # Must be entered securely in Render dashboard
      - key: FRONTEND_URL
        sync: false # Enter your Vercel URL, e.g. https://contentflow-ai.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: contentflow-db
          property: connectionString

databases:
  - name: contentflow-db
    plan: free
    databaseName: contentflow
    user: contentflow_user
